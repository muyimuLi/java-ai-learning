<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek 流式响应 Demo</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 32px 20px;
            font-family: system-ui, "Microsoft YaHei", sans-serif;
            background: #f5f6f8; color: #1f2328;
        }
        .wrap { max-width: 780px; margin: 0 auto; }
        h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
        .sub { font-size: 12px; color: #656d76; margin-bottom: 18px; }
        .bar { display: flex; gap: 8px; }
        #q {
            flex: 1; padding: 11px 13px; font-size: 14px;
            border: 1px solid #d0d7de; border-radius: 6px; outline: none;
        }
        #q:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,.15); }
        button {
            padding: 11px 20px; font-size: 14px; border: 0; border-radius: 6px;
            background: #1f6feb; color: #fff; cursor: pointer; white-space: nowrap;
        }
        button:disabled { opacity: .45; cursor: default; }
        #stop { background: #6e7781; }
        #out {
            margin-top: 16px; padding: 16px; min-height: 170px;
            background: #fff; border: 1px solid #d0d7de; border-radius: 6px;
            white-space: pre-wrap; word-break: break-word;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 14px; line-height: 1.75;
        }
        #out.cursor::after {
            content: "▋"; margin-left: 2px; color: #1f6feb;
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .meta { margin-top: 10px; font-size: 12px; color: #656d76; }
        .meta.err { color: #cf222e; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>DeepSeek 流式响应 Demo</h1>
    <div class="sub">GET /ai &nbsp;·&nbsp; text/event-stream &nbsp;·&nbsp; fetch + ReadableStream 逐块渲染</div>

    <div class="bar">
        <input id="q" type="text" autocomplete="off"
               value="用三句话解释什么是流式响应"
               placeholder="输入问题后按回车">
        <button id="send">发送</button>
        <button id="stop" disabled>停止</button>
    </div>

    <div id="out"></div>
    <div class="meta" id="meta">等待发送…</div>
</div>

<script>
    const q = document.getElementById('q');
    const out = document.getElementById('out');
    const meta = document.getElementById('meta');
    const sendBtn = document.getElementById('send');
    const stopBtn = document.getElementById('stop');

    let controller = null;

    function setBusy(busy) {
        sendBtn.disabled = busy;
        stopBtn.disabled = !busy;
        out.classList.toggle('cursor', busy);
    }

    async function stream(text) {
        controller = new AbortController();
        setBusy(true);
        out.textContent = '';
        meta.className = 'meta';
        meta.textContent = '请求中…';

        const started = performance.now();
        let chars = 0;

        try {
            const resp = await fetch('/ai?userInput=' + encodeURIComponent(text), {
                headers: { 'Accept': 'text/event-stream' },
                signal: controller.signal
            });

            if (!resp.ok) {
                throw new Error('HTTP ' + resp.status + '：' + (await resp.text()).slice(0, 300));
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const {done, value} = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, {stream: true});

                // SSE 用空行分隔事件；最后一段可能不完整，留在 buffer 里等下一块
                const events = buffer.split(/\r?\n\r?\n/);
                buffer = events.pop();

                for (const event of events) {
                    const dataLines = [];
                    for (const line of event.split(/\r?\n/)) {
                        if (line.startsWith('data:')) {
                            dataLines.push(line.slice(5).replace(/^ /, ''));
                        }
                    }
                    if (dataLines.length === 0) continue;

                    // 一个事件里的多行 data 要按规范用换行拼回来
                    const chunk = dataLines.join('\n');
                    if (chunk === '[DONE]') continue;

                    out.textContent += chunk;
                    chars += chunk.length;
                    meta.textContent = '接收中… 已收到 ' + chars + ' 字';
                }
            }

            const seconds = ((performance.now() - started) / 1000).toFixed(1);
            meta.textContent = '完成：共 ' + chars + ' 字，用时 ' + seconds + ' 秒';

        } catch (e) {
            if (e.name === 'AbortError') {
                meta.textContent = '已停止，共收到 ' + chars + ' 字';
            } else {
                meta.className = 'meta err';
                meta.textContent = '出错：' + e.message;
            }
        } finally {
            setBusy(false);
            controller = null;
        }
    }

    sendBtn.onclick = () => {
        const text = q.value.trim();
        if (text) stream(text);
    };

    stopBtn.onclick = () => {
        if (controller) controller.abort();
    };

    q.addEventListener('keydown', e => {
        if (e.key === 'Enter') sendBtn.click();
    });
</script>
</body>
</html>
